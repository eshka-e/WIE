{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'img/np.png' %}" alt="reset">
        </div>


        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <input type="password" name="new_password1" id="id_new_password1" placeholder="НОВЫЙ ПАРОЛЬ" required>
            </div>

            <div class="form-group">
                <input type="password" name="new_password2" id="id_new_password2" placeholder="ПОДТВЕРДИТЕ ПАРОЛЬ" required>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="submit-btn">СОХРАНИТЬ</button>
        </form>
    </div>
</div>

<style>
    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Thin.woff2') format('woff2');
        font-weight: 100;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Light.woff2') format('woff2');
        font-weight: 300;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Black.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-ThinItalic.woff2') format('woff2');
        font-weight: 100;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-LightItalic.woff2') format('woff2');
        font-weight: 300;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-RegularItalic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-MediumItalic.woff2') format('woff2');
        font-weight: 500;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-SemiBoldItalic.woff2') format('woff2');
        font-weight: 600;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-BoldItalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-BlackItalic.woff2') format('woff2');
        font-weight: 900;
        font-style: italic;
    }

    html {
        font-size: 16px;
    }

    body {
        font-family: 'Non Bureau', sans-serif;
        color: #171A2A;
        margin: 50px;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding-top: 0;
    }

    .auth-container {
        width: 100%;
        max-width: 700px;
        padding: 20px;
        box-sizing: border-box;
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-logo img {
        height: 270px;
        width: auto;
        display: inline-block;
        object-fit: contain;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 32px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .form-group input {
        width: 100%;
        font-size: 50px;
        font-style: italic;
        font-weight: 300;
        color: #304361;
        background: transparent;
        border: none;
        border-bottom: 2px solid #171A2A;
        padding: 12px 0 8px 0;
        outline: none;
        transition: all 0.2s ease;
        font-family: inherit;
        box-sizing: border-box;
    }

    .form-group input::placeholder {
        color: #a0aec0;
        font-style: italic;
        font-size: 50px;
        opacity: 0.5;
        font-weight: 200;
    }

    .form-group input:focus {
        border-bottom-color: #05026C;
    }

    .submit-btn {
        width: auto;
        padding: 12px 24px;
        font-size: 20px;
        font-family: 'Non Bureau', sans-serif;
        background: #000000;
        color: white;
        border: none;
        cursor: pointer;
        transition: opacity 0.2s ease;
    }

    .submit-btn:hover {
        opacity: 0.8;
    }

    h2 {
        font-size: 32px;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .auth-container {
            max-width: 90%;
            padding: 15px;
        }

        .auth-logo img {
            height: 180px;
        }

        .form-group input {
            font-size: 32px;
        }

        .form-group input::placeholder {
            font-size: 32px;
        }

        .submit-btn {
            width: 100%;
            font-size: 18px;
            padding: 12px;
        }

        h2 {
            font-size: 24px;
        }
    }

    @media (max-width: 480px) {
        .auth-logo img {
            height: 120px;
        }

        .form-group input {
            font-size: 24px;
        }

        .form-group input::placeholder {
            font-size: 24px;
        }

        .submit-btn {
            font-size: 16px;
        }

        h2 {
            font-size: 20px;
        }

        .auth-form {
            gap: 24px;
        }
    }
</style>
{% endblock %}
