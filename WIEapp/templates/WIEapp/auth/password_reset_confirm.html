{% extends 'WIEapp/base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'WIEapp/images/auto.png' %}" alt="reset">
        </div>

        <h2 style="text-align: center; margin-bottom: 1.5rem;">НОВЫЙ ПАРОЛЬ</h2>

        <form method="post" class="auth-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_new_password1">НОВЫЙ ПАРОЛЬ</label>
                <input type="password" name="new_password1" id="id_new_password1" required>
            </div>

            <div class="form-group">
                <label for="id_new_password2">ПОДТВЕРЖДЕНИЕ</label>
                <input type="password" name="new_password2" id="id_new_password2" required>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="auth-btn">СОХРАНИТЬ</button>
        </form>
    </div>
</div>
{% endblock %}
