{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHOisE — ВХОД</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
</head>
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'img/auto.png' %}" alt="auto">
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">

                <input type="email" name="email" id="id_email"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <input type="password" name="password1" id="id_password1"
                       placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <input type="password" name="password2" id="id_password2"
                       placeholder="ПОДТВЕРДИТЬ ПАРОЛЬ" required>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="auth-btn">ПРОДОЛЖИТЬ</button>
        </form>

        <div class="auth-footer">
            <p>УЖЕ ЕСТЬ АККАУНТ? <a href="{% url 'WIEapp:login' %}">ВОЙТИ</a></p>
        </div>
    </div>
</div>
{% endblock %}
