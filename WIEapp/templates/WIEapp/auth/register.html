{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>WHOisE — РЕГИСТРАЦИЯ</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <style>
        /* ТОЛЬКО АДАПТИВ */

        /* ПЛАНШЕТЫ И МОБИЛЬНЫЕ */
        @media (max-width: 768px) {
            .auth-container {
                width: 90%;
                max-width: 400px;
                padding: 15px;
            }

            .auth-card {
                padding: 0;
            }

            .auth-logo img {
                max-width: 100%;
                height: auto;
                max-height: 150px;
            }

            .form-group input {
                width: 100%;
                box-sizing: border-box;
                font-size: 14px;
                padding: 10px;
            }

            .submit-btn {
                width: 100%;
                box-sizing: border-box;
                font-size: 18px;
                padding: 10px;
            }

            .auth-footer p {
                font-size: 12px;
            }
        }

        /* МАЛЕНЬКИЕ ТЕЛЕФОНЫ */
        @media (max-width: 480px) {
            .auth-container {
                width: 95%;
                padding: 10px;
            }

            .auth-logo img {
                max-height: 120px;
            }

            .form-group input {
                font-size: 12px;
                padding: 8px;
            }

            .submit-btn {
                font-size: 16px;
                padding: 8px;
            }

            .auth-footer p {
                font-size: 11px;
            }
        }

        /* ОЧЕНЬ МАЛЕНЬКИЕ ТЕЛЕФОНЫ */
        @media (max-width: 320px) {
            .auth-logo img {
                max-height: 100px;
            }

            .form-group input {
                font-size: 11px;
                padding: 7px;
            }

            .submit-btn {
                font-size: 14px;
                padding: 7px;
            }
        }
    </style>
</head>
<body>
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'img/auto.png' %}" alt="auto">
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <input type="email" name="email" id="id_email"
                       placeholder="you@example.com" required>
            </div>

            <div class="form-group">
                <input type="password" name="password1" id="id_password1"
                       placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <input type="password" name="password2" id="id_password2"
                       placeholder="ПОДТВЕРДИТЬ ПАРОЛЬ" required>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="submit-btn">ПРОДОЛЖИТЬ</button>
        </form>

        <div class="auth-footer">
            <p>УЖЕ ЕСТЬ АККАУНТ? <a href="{% url 'WIEapp:login' %}">ВОЙТИ</a></p>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
