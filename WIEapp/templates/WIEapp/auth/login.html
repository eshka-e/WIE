{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WHOisE — ВХОД</title>
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
   <style>
    /* ТОЛЬКО АДАПТИВ (базовые стили из auth.css не трогаем) */

    /* ПЛАНШЕТЫ И МОБИЛЬНЫЕ */
    @media (max-width: 768px) {
        .auth-container {
            width: 90%;
            max-width: 400px;
            padding: 20px;
        }

        .auth-logo img {
            max-width: 100%;
            height: auto;
            max-height: 150px;
        }

        .form-group input {
            font-size: 14px;
            padding: 10px;
        }

        .submit-btn {
            font-size: 18px;
            padding: 10px;
        }

        .auth-footer p {
            font-size: 12px;
        }
    }

    /* МАЛЕНЬКИЕ ТЕЛЕФОНЫ */
    @media (max-width: 480px) {
        .auth-container {
            width: 95%;
            padding: 15px;
        }

        .auth-logo img {
            max-height: 120px;
        }

        .form-group input {
            font-size: 12px;
            padding: 8px;
        }

        .submit-btn {
            font-size: 16px;
            padding: 8px;
        }

        .auth-footer p {
            font-size: 11px;
        }

        .auth-footer {
            margin-top: 20px;
        }
    }

    /* ОЧЕНЬ МАЛЕНЬКИЕ */
    @media (max-width: 320px) {
        .auth-logo img {
            max-height: 100px;
        }

        .form-group input {
            font-size: 11px;
        }

        .submit-btn {
            font-size: 14px;
        }
    }
</style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-logo">
            <img src="{% static 'img/login.png' %}" alt="login">
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="username" id="id_username"
                       placeholder="ЛОГИН / ПОЧТА" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" id="id_password"
                       placeholder="ПАРОЛЬ" required>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="submit-btn">ПОДТВЕРДИТЬ</button>
        </form>

        <div class="auth-footer">
            <p>НЕТ АККАУНТА? <a href="{% url 'WIEapp:register' %}">СТАТЬ СЛЕДОМ</a></p>
            <p><a href="{% url 'WIEapp:password_reset' %}">ЗАБЫЛИ ПАРОЛЬ?</a></p>
        </div>
    </div>
</body>
</html>
