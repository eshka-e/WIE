
{% load static %}

{% block content %}
<div class="auth-container">

        <div class="auth-logo">
            <img src="{% static 'WIEapp/images/auto.png' %}" alt="mail">
        </div>

        <h2 style="text-align: center; margin-bottom: 1rem;">📧 ПРОВЕРЬТЕ ПОЧТУ</h2>

        <div class="auth-footer">
