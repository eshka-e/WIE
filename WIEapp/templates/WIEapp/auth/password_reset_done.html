{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'img/mch.png' %}" alt="done">
        </div>

        <p class="inf">Мы отправили инструкцию по сбросу пароля на указанный email.</p>

        <div class="auth-footer">
            <p><a href="{% url 'WIEapp:login' %}">ВЕРНУТЬСЯ КО ВХОДУ</a></p>
        </div>
    </div>
</div>

<style>
    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Thin.woff2') format('woff2');
        font-weight: 100;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Light.woff2') format('woff2');
        font-weight: 300;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Medium.woff2') format('woff2');
        font-weight: 500;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-SemiBold.woff2') format('woff2');
        font-weight: 600;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Bold.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-Black.woff2') format('woff2');
        font-weight: 900;
        font-style: normal;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-ThinItalic.woff2') format('woff2');
        font-weight: 100;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-LightItalic.woff2') format('woff2');
        font-weight: 300;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-RegularItalic.woff2') format('woff2');
        font-weight: 400;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-MediumItalic.woff2') format('woff2');
        font-weight: 500;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-SemiBoldItalic.woff2') format('woff2');
        font-weight: 600;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-BoldItalic.woff2') format('woff2');
        font-weight: 700;
        font-style: italic;
    }

    @font-face {
        font-family: 'Non Bureau';
        src: url('../fonts/NonBureau-BlackItalic.woff2') format('woff2');
        font-weight: 900;
        font-style: italic;
    }

    html {
        font-size: 16px;
    }

    body {
        font-family: 'Non Bureau', sans-serif;
        color: #171A2A;
        margin: 50px;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding-top: 0;
    }

    .auth-container {
        width: 100%;
        max-width: 700px;
        padding: 20px;
        box-sizing: border-box;
    }

    .auth-logo {
        text-align: center;
        margin-bottom: 40px;
    }

    .auth-logo img {
        height: 270px;
        width: auto;
        display: inline-block;
        object-fit: contain;
    }

    .auth-footer {
        margin-top: 40px;
        text-align: center;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .auth-footer p {
        font-size: 20px;
        font-weight: 400;
        font-style: normal;
        color: #171A2A;
    }

    .auth-footer a {
        color: #05026C;
        font-size: 20px;
        font-style: italic;
        font-weight: 400;
        text-decoration: none;
        transition: opacity 0.2s ease;
    }

    .auth-footer a:hover {
        opacity: 0.7;
    }

    .inf {
        font-weight: 300;
        font-size: 30px;
        margin: 15px 50px;
        text-align: center;
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
        .auth-container {
            max-width: 90%;
            padding: 15px;
        }

        .auth-logo img {
            height: 180px;
        }

        .inf {
            font-size: 24px;
            margin: 15px 20px;
        }

        .auth-footer p,
        .auth-footer a {
            font-size: 16px;
        }
    }

    @media (max-width: 480px) {
        .auth-logo img {
            height: 120px;
        }

        .inf {
            font-size: 20px;
            margin: 10px 15px;
        }

        .auth-footer p,
        .auth-footer a {
            font-size: 14px;
        }

        .auth-footer {
            margin-top: 30px;
        }
    }
</style>
{% endblock %}
