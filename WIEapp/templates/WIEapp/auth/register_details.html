
{% load static %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-logo">
            <img src="{% static 'WIEapp/images/auto.png' %}" alt="auto">
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}

            <div class="form-group">
                <label for="id_username">ЮЗЕРНЕЙМ</label>
                <input type="text" name="username" id="id_username"
                       placeholder="например: eugene_ew" required>
                <small class="form-hint">Будет отображаться как @username</small>
            </div>

            <div class="form-group">
                <label for="id_display_name">ВАШЕ ИМЯ</label>
                <input type="text" name="display_name" id="id_display_name"
                       placeholder="например: Евгений" required>
            </div>

            <div class="form-group">
                <label for="id_bio">О СЕБЕ (НЕОБЯЗАТЕЛЬНО)</label>
                <textarea name="bio" id="id_bio" rows="4"
                          placeholder="ФОТОГРАФ, ДИЗАЙНЕР, ХОДОВИК..."></textarea>
            </div>

            {% if form.errors %}
                <div class="form-errors">
                    {% for field, errors in form.errors.items %}
                        {% for error in errors %}
                            <p class="error-text">{{ error }}</p>
                        {% endfor %}
                    {% endfor %}
                </div>
            {% endif %}

            <button type="submit" class="auth-btn">СТАТЬ СЛЕДОМ</button>
        </form>
    </div>
</div>
{% endblock %}
