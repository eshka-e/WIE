{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="muted-container">
    <div class="muted-card">
        <img class="muted-icon" src="{% static 'img/mut.png' %}" alt="Логотип WHOisE">
        <p>Вы заглушили @{{ profile.user.username }}. Чтобы видеть его контент, восстановите связь со следом.</p>
        <button id="unmute-btn" data-user-id="{{ profile.id }}" class="unmute-btn">ВОССТАНОВИТЬ СВЯЗЬ</button>
    </div>
</div>

<style>
  body, html {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
    }

       .muted-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100%;
            padding: 2rem 70px;
        }

        .muted-card {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .muted-icon {
            display: block;
            max-width: 100%;
            height: auto;
            max-height: 500px;
            width: auto;
            object-fit: contain;
        }

        .muted-card p {
            font-size: 32px;
            font-weight: 200;
            line-height: 1.3;
            text-align: left;
            width: 100%;
            margin: 0;
            color: #1e2a3e;
        }

        .unmute-btn {
            padding: 4px 25px;
        border: 1px solid #990002;
        background: none;
        color: #990002;
        border-radius: 3px;
        font-size: 18px;
        letter-spacing: 0.1em;
        transition: all 0.2s ease;
        cursor: pointer;

        }

        .unmute-btn:hover {
           border: 1px solid #FF0000;
         color: #FF0000;
        background: none;
        }

        .unmute-btn:active {
            border: 1px solid #380000;
         color: #380000;
        background: none;
        }

        @media (max-width: 768px) {
            .muted-container {
                padding: 2rem 20px;
            }
            .muted-card p {
                font-size: 24px;
            }
</style>

<script>
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const csrftoken = getCookie('csrftoken');

    document.getElementById('unmute-btn')?.addEventListener('click', function() {
        const userId = this.dataset.userId;
        fetch('/api/mute/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                'X-CSRFToken': csrftoken
            },
            body: `user_id=${userId}`
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'unmuted') {
                location.reload();
            }
        });
    });
</script>
{% endblock %}
