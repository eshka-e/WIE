{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="form-container">
    <h1>{% if editing %}РЕДАКТИРОВАТЬ ИМПУЛЬС{% else %}НОВЫЙ ИМПУЛЬС{% endif %}</h1>

    <form method="post" enctype="multipart/form-data" class="impulse-form" id="impulse-form">
        {% csrf_token %}

        <div class="form-group">
            <label for="id_space">ПРОСТРАНСТВО</label>
            {{ form.space }}
            <div class="form-hint" id="space-hint"></div>
        </div>

        <!-- ГРУППА ЗАГОЛОВКА -->
        <div class="form-group" id="title-group">
            <label for="id_title">ЗАГОЛОВОК</label>
            {{ form.title }}
            <div class="form-error" id="title-error"></div>
        </div>

        <!-- ГРУППА ТЕКСТА -->
        <div class="form-group" id="content-group">
            <label for="id_content">ТЕКСТ</label>
            {{ form.content }}
            <div class="form-error" id="content-error"></div>
        </div>

        <!-- ГРУППА МЕДИА -->
        <div class="form-group" id="media-group" style="display: none;">
            <label id="media-label">МЕДИА</label>
            <div id="image-group" style="display: none;">
                {{ form.image }}
            </div>
            <div id="video-group" style="display: none;">
                {{ form.video_url }}
            </div>
            <div class="form-hint" id="media-hint"></div>
            <div class="form-error" id="media-error"></div>
            <div class="media-preview" id="media-preview" style="display: none;">
                <img id="preview-image" src="" alt="preview">
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="submit-btn">
                {% if editing %}СОХРАНИТЬ{% else %}ОПУБЛИКОВАТЬ{% endif %}
            </button>
            <a href="{% if editing %}{% url 'WIEapp:impulse_detail' impulse.id %}{% else %}{% url 'WIEapp:stream' %}{% endif %}" class="cancel-btn">ОТМЕНА</a>
        </div>
    </form>
</div>

<style>
    @font-face {
        font-family: 'Waterway';
        src: url('{% static "fonts/Waterway Display Font.ttf" %}') format('truetype');
        font-weight: normal;
        font-style: normal;
    }

    /* Базовые стили + адаптив */
    .form-container {
        max-width: 700px;
        margin: 0 auto;
        padding: 2rem;
    }

    h1 {
        font-family: 'Waterway', sans-serif;
        font-size: 34px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 2rem;
        text-align: left;
        border-left: none;
        padding-left: 0;
    }

    .form-group {
        margin-bottom: 1.5rem;
    }

    .form-group label {
        display: block;
        font-family: 'Waterway', sans-serif;
        font-size: 34px;
        font-weight: normal;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 0.5rem;
        text-align: left;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        background: white;
        border: none;
        border-bottom: 2px solid #171a2a;
        padding: 0.8rem;
        font-family: inherit;
        font-size: 0.9rem;
        outline: none;
        box-sizing: border-box;
        transition: border-bottom-color 0.3s ease;
        -webkit-appearance: none;
        appearance: none;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        outline: none;
        border-bottom-color: #4f81b4;
    }

    /* Стили для select на мобильных */
    .form-group select {
        background: white;
        cursor: pointer;
    }

    .form-group textarea {
        resize: vertical;
        min-height: 150px;
    }

    .form-hint {
        font-size: 0.7rem;
        color: #8a9cb0;
        margin-top: 0.3rem;
        text-align: left;
    }

    .form-error {
        font-size: 0.7rem;
        color: #e03a3a;
        margin-top: 0.3rem;
        text-align: left;
    }

    .media-preview {
        margin-top: 1rem;
        background: #f8fafc;
        padding: 1rem;
        text-align: center;
        border-radius: 4px;
    }

    .media-preview img {
        max-width: 100%;
        max-height: 200px;
        object-fit: contain;
    }

    .form-actions {
        display: flex;
        gap: 1rem;
        margin-bottom: 1.5rem;
        align-items: center;
        flex-wrap: wrap;
    }

    .submit-btn {
        background: #171A2A;
        color: white;
        border: none;
        border-radius: 3px;
        padding: 0 110px;
        height: 60px;
        line-height: 1;
        font-size: 48px;
        font-weight: 800;
        font-style: italic;
        letter-spacing: 1.5px;
        cursor: pointer;
        transition: all 0.2s ease;
        font-family: inherit;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        flex: 1;
        min-width: 200px;
    }

    .submit-btn:hover {
        background: #251111;
        transform: scale(0.98);
    }

    .submit-btn:active {
        background: #140000;
        transform: scale(0.98);
    }

    .cancel-btn {
        background: transparent;
        border: 1px solid #dce5ec;
        border-radius: 3px;
        color: #8a9cb0;
        height: 60px;
        line-height: 1;
        padding: 0 24px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-family: inherit;
        font-size: 16px;
        transition: all 0.2s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        flex: 1;
        min-width: 150px;
    }

    .cancel-btn:hover {
        border-color: #05026c;
        color: #05026c;
        transform: scale(0.98);
    }

    .cancel-btn:active {
        transform: scale(0.98);
    }

    /* ========== АДАПТИВНЫЕ СТИЛИ ========== */

    /* Планшеты и маленькие ноутбуки (768px - 1024px) */
    @media (max-width: 1024px) {
        .form-container {
            max-width: 90%;
            padding: 1.8rem;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 1.8rem;
        }

        .form-group label {
            font-size: 30px;
        }

        .submit-btn {
            font-size: 42px;
            padding: 0 60px;
        }
    }

    /* Мобильные устройства (до 768px) */
    @media (max-width: 768px) {
        .form-container {
            padding: 1.5rem;
            max-width: 95%;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .form-group label {
            font-size: 24px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.7rem;
            font-size: 16px; /* Предотвращаем автоматическое масштабирование на iOS */
        }

        .form-group textarea {
            min-height: 120px;
        }

        .form-actions {
            flex-direction: column;
            gap: 0.8rem;
        }

        .submit-btn {
            font-size: 36px;
            padding: 0 20px;
            height: 55px;
            width: 100%;
            min-width: auto;
        }

        .cancel-btn {
            height: 50px;
            padding: 0 20px;
            width: 100%;
            min-width: auto;
            font-size: 14px;
        }

        .media-preview {
            padding: 0.8rem;
        }

        .media-preview img {
            max-height: 150px;
        }
    }

    /* Маленькие мобильные устройства (до 480px) */
    @media (max-width: 480px) {
        .form-container {
            padding: 1rem;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 1.2rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            font-size: 20px;
            margin-bottom: 0.3rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 0.6rem;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
        }

        .form-hint,
        .form-error {
            font-size: 0.65rem;
        }

        .submit-btn {
            font-size: 28px;
            height: 50px;
        }

        .cancel-btn {
            height: 45px;
            font-size: 12px;
        }

        .media-preview img {
            max-height: 120px;
        }
    }

    /* Для устройств с очень маленькой шириной (до 320px) */
    @media (max-width: 320px) {
        h1 {
            font-size: 20px;
        }

        .form-group label {
            font-size: 18px;
        }

        .submit-btn {
            font-size: 24px;
            height: 45px;
        }

        .cancel-btn {
            font-size: 11px;
            height: 40px;
        }
    }

    /* Альбомная ориентация на мобильных */
    @media (max-width: 768px) and (orientation: landscape) {
        .form-container {
            padding: 1rem;
        }

        .form-group textarea {
            min-height: 80px;
        }

        .form-actions {
            flex-direction: row;
        }

        .submit-btn,
        .cancel-btn {
            font-size: 24px;
            height: 45px;
        }
    }

    /* Для устройств с высоким DPI (Retina) */
    @media (-webkit-min-device-pixel-ratio: 2), (min-resolution: 192dpi) {
        .form-group input,
        .form-group select,
        .form-group textarea {
            border-bottom-width: 1.5px;
        }
    }

    /* Улучшенная доступность для touch-устройств */
    @media (hover: none) and (pointer: coarse) {
        .submit-btn,
        .cancel-btn,
        .form-group select,
        .form-group input,
        .form-group textarea {
            cursor: pointer;
        }

        .submit-btn:active {
            transform: scale(0.96);
        }

        .cancel-btn:active {
            transform: scale(0.96);
        }
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Находим все нужные элементы
        const spaceSelect = document.getElementById('id_space');
        const titleGroup = document.getElementById('title-group');
        const contentGroup = document.getElementById('content-group');
        const mediaGroup = document.getElementById('media-group');
        const imageGroup = document.getElementById('image-group');
        const videoGroup = document.getElementById('video-group');
        const mediaLabel = document.getElementById('media-label');
        const mediaHint = document.getElementById('media-hint');
        const imageInput = document.getElementById('id_image');
        const videoInput = document.getElementById('id_video_url');
        const previewDiv = document.getElementById('media-preview');
        const previewImage = document.getElementById('preview-image');
        const spaceHint = document.getElementById('space-hint');

        // ПРАВИЛА по ID пространств
        const rules = {
            '1': {  // ВИДЕНИЕ (vision)
                type: 'image',
                label: 'ИЗОБРАЖЕНИЕ',
                hint: 'Обязательно загрузите изображение. Заголовок и описание — по желанию.'
            },
            '2': {  // ЧУВСТВО (nerve)
                type: 'none',
                label: '',
                hint: 'Только текст. Заголовок и описание обязательны.'
            },
            '3': {  // РЕМЕСЛО (craft)
                type: 'video',
                label: 'ВИДЕО (URL)',
                hint: 'Обязательно укажите ссылку на видео. Заголовок и описание обязательны.'
            }
        };

        // Функция, которая показывает/скрывает поля
        function updateForm() {
            const selectedSpace = spaceSelect.value;
            const rule = rules[selectedSpace];

            if (!rule) return;

            // Определяем, что нужно показывать
            if (rule.type === 'none') {
                // Для ЧУВСТВО - скрываем всё медиа
                mediaGroup.style.display = 'none';
                if (imageInput) imageInput.value = '';
                if (videoInput) videoInput.value = '';
                if (previewDiv) previewDiv.style.display = 'none';
            } else {
                // Для ВИДЕНИЕ и РЕМЕСЛО - показываем медиа
                mediaGroup.style.display = 'block';
                mediaLabel.textContent = rule.label;
                mediaHint.textContent = rule.hint;

                if (rule.type === 'image') {
                    imageGroup.style.display = 'block';
                    videoGroup.style.display = 'none';
                    if (videoInput) videoInput.value = '';
                    if (previewDiv) previewDiv.style.display = 'none';
                } else if (rule.type === 'video') {
                    imageGroup.style.display = 'none';
                    videoGroup.style.display = 'block';
                    if (imageInput) imageInput.value = '';
                    if (previewDiv) previewDiv.style.display = 'none';
                }
            }

            // Показываем подсказку вверху
            if (spaceHint) {
                spaceHint.innerHTML = rule.hint;
            }

            // Меняем цвет label для обязательных полей
            const titleLabel = titleGroup.querySelector('label');
            const contentLabel = contentGroup.querySelector('label');

            if (selectedSpace === '2' || selectedSpace === '3') {  // nerve или craft
                titleLabel.style.color = '#e03a3a';
                contentLabel.style.color = '#e03a3a';
            } else {
                titleLabel.style.color = '';
                contentLabel.style.color = '';
            }
        }

        // Показываем превью картинки
        if (imageInput) {
            imageInput.addEventListener('change', function() {
                const file = this.files[0];
                if (file && file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        previewDiv.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewDiv.style.display = 'none';
                    previewImage.src = '';
                }
            });
        }

        // Запускаем при загрузке и при смене пространства
        updateForm();
        spaceSelect.addEventListener('change', updateForm);

        // Дополнительные улучшения для мобильных устройств
        // Убираем эффект масштабирования при фокусе на iOS
        const inputs = document.querySelectorAll('input, select, textarea');
        inputs.forEach(input => {
            input.addEventListener('touchstart', function() {
                this.style.fontSize = '16px';
            });
        });
    });
</script>
{% endblock %}
