{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="stream-container {% if current_space.name == 'craft' %}craft-container{% elif current_space.name == 'nerve' %}nerve-container{% else %}default-container{% endif %}">
    <div class="stream-header">
        <h2 class="space-title">{{ current_space.get_name_display }}</h2>
    </div>

    <div class="stream-mode-bar">
        <button class="mode-btn {% if mode == 'all' %}active{% endif %}" data-mode="all">ОБЩЕЕ</button>
        <button class="mode-btn {% if mode == 'followed' %}active{% endif %}" data-mode="followed">МОИ ОРИЕНТИРЫ</button>
    </div>

    <div class="impulses-list" id="impulses-list">
        {% include 'WIEapp/include/impulse_cards.html' with impulses=impulses has_next=has_next %}
    </div>
</div>

<style>
    .stream-container {
        width: 1200px;
        margin: 0 auto;
        padding: 2rem;
    }

    .default-container {
        max-width: 800px;
    }

    .nerve-container {
        max-width: 900px;
    }

    .craft-container {
        max-width: 1200px;
    }

    .stream-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 2rem;
    }

    .space-title {
        font-size: 32px;
    }

    .stream-mode-bar {
        position: sticky;
        top: 10px;
        background: rgba(255, 255, 255, 0.62);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(15px);
        display: flex;
        gap: 2rem;
        justify-content: center;
        padding: 0.3rem 1rem;
        margin-bottom: 2rem;
        border-radius: 4px;
        z-index: 10;
    }

    .mode-btn {
        background: transparent;
        border: none;
        font-family: 'Non Bureau', monospace;
        font-size: 28px;
        font-weight: 400;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #171a2a;
        cursor: pointer;
        padding: 0.2rem 0;
        transition: all 0.2s;
    }

    .mode-btn.active {
        color: #05026c;
    }

    .mode-btn:hover {
        color: #03009f;
    }

    @media (max-width: 1024px) {
        .stream-container {
            width: 100%;
            padding: 1.5rem;
        }
        .craft-container {
            max-width: 95%;
        }
    }

    @media (max-width: 768px) {
        .stream-container {
            padding: 1rem;
        }
        .default-container,
        .nerve-container,
        .craft-container {
            max-width: 100%;
        }
        .mode-btn {
            font-size: 18px;
        }
        .stream-mode-bar {
            gap: 1rem;
            padding: 0.2rem 0.5rem;
            top: 5px;
        }
        .space-title {
            font-size: 24px;
        }
        .stream-header {
            margin-bottom: 1rem;
        }
    }
</style>

<script>
    let currentMode = '{{ mode|default:"all" }}';
    let hasMore = {{ has_next|lower }};
    let loading = false;
    let nextPage = null;
    let loaderElement = null;

    function attachResonanceListeners() {
        if (typeof attachCardResonanceListeners === 'function') {
            attachCardResonanceListeners();
        }
    }

    function initModeSwitcher() {
        const modeBtns = document.querySelectorAll('.mode-btn');
        const impulsesList = document.getElementById('impulses-list');

        if (modeBtns.length === 0) return;

        modeBtns.forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const mode = this.dataset.mode;
                const spaceName = '{{ current_space.name }}';
                currentMode = mode;
                hasMore = true;
                nextPage = null;

                modeBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                fetch(`/space/${spaceName}/?mode=${mode}`, {
                    headers: { 'X-Requested-With': 'XMLHttpRequest' }
                })
                .then(response => response.text())
                .then(html => {
                    impulsesList.innerHTML = html;
                    attachResonanceListeners();
                    initInfiniteScroll();
                })
                .catch(error => console.error('Ошибка переключения:', error));
            });
        });
    }

    function initInfiniteScroll() {
        const trigger = document.querySelector('.loading-trigger');
        if (trigger && hasMore) {
            nextPage = trigger.dataset.nextPage || null;
            loaderElement = trigger;
        } else {
            nextPage = null;
            loaderElement = null;
            hasMore = false;
        }
        loading = false;
    }

    function loadMore() {
        if (loading || !hasMore || !nextPage) return;

        loading = true;
        if (loaderElement) loaderElement.style.display = 'block';

        const spaceName = '{{ current_space.name }}';

        fetch(`/space/${spaceName}/?mode=${currentMode}&page=${nextPage}`, {
            headers: { 'X-Requested-With': 'XMLHttpRequest' }
        })
        .then(response => response.text())
        .then(html => {
            const impulsesList = document.getElementById('impulses-list');
            impulsesList.insertAdjacentHTML('beforeend', html);

            const newTrigger = document.querySelector('.loading-trigger');
            if (newTrigger && newTrigger.dataset.nextPage) {
                nextPage = newTrigger.dataset.nextPage;
                if (loaderElement) loaderElement.dataset.nextPage = nextPage;
                hasMore = true;
            } else {
                hasMore = false;
                if (loaderElement) loaderElement.remove();
            }

            attachResonanceListeners();
            loading = false;
            if (loaderElement) loaderElement.style.display = 'none';
        })
        .catch(error => {
            console.error('Ошибка загрузки:', error);
            loading = false;
        });
    }

    function handleScroll() {
        if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
            loadMore();
        }
    }

    document.addEventListener('DOMContentLoaded', function() {
        attachResonanceListeners();
        initModeSwitcher();
        initInfiniteScroll();
        window.addEventListener('scroll', handleScroll);
    });
</script>
{% endblock %}
