{% load static %}

{% block content %}
<div class="spaces-container">
    <div class="spaces-row">
        <!-- ВИДЕНИЕ -->
        <a href="{% url 'WIEapp:space_detail' 'vision' %}" class="space-card" data-original-img="{% static 'img/vision-placeholder.png' %}" data-hover-img="{% static 'img/vision-hover.png' %}">
            <div class="space-image">
                <img src="{% static 'img/vision-placeholder.png' %}" alt="ВИДЕНИЕ" class="card-img">
            </div>
            <h2>ВИДЕНИЕ</h2>
        </a>

        <!-- ЧУТКОСТЬ -->
        <a href="{% url 'WIEapp:space_detail' 'nerve' %}" class="space-card" data-original-img="{% static 'img/nerve-placeholder.png' %}" data-hover-img="{% static 'img/nerve-hover.png' %}">
            <div class="space-image">
                <img src="{% static 'img/nerve-placeholder.png' %}" alt="ЧУВСТВО" class="card-img">
            </div>
            <h2>ЧУВСТВО</h2>
        </a>

        <!-- РЕМЕСЛО -->
        <a href="{% url 'WIEapp:space_detail' 'craft' %}" class="space-card" data-original-img="{% static 'img/craft-placeholder.png' %}" data-hover-img="{% static 'img/craft-hover.png' %}">
            <div class="space-image">
                <img src="{% static 'img/craft-placeholder.png' %}" alt="РЕМЕСЛО" class="card-img">
            </div>
            <h2>РЕМЕСЛО</h2>
        </a>

        <!-- ПОТОК -->
        <a href="{% url 'WIEapp:stream' %}" class="space-card" data-original-img="{% static 'img/stream-placeholder.png' %}" data-hover-img="{% static 'img/stream-hover.png' %}">
            <div class="space-image">
                <img src="{% static 'img/stream-placeholder.png' %}" alt="ПОТОК" class="card-img">
            </div>
            <h2>ПОТОК</h2>
        </a>
    </div>
</div>

<style>
    /* БАЗОВЫЕ СТИЛИ */
    .spaces-container {
        font-family: 'Non Bureau', sans-serif;
        max-width: 1400px;
        margin: 0 auto;
        padding: 20px;
    }

    .spaces-row {
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 25px;
        align-items: flex-start;
        flex-wrap: wrap;
    }

    /* КАРТОЧКА — исходное состояние */
    .space-card {
        display: flex;
        flex-direction: column;
        text-decoration: none;
        color: inherit;
        background: transparent;
        width: 320px;
        border-radius: 5px;
        transition: all 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
        overflow: hidden;
        border: none;
        box-shadow: none;
        position: relative;
    }

    /* Увеличение при наведении (только для мыши) */
    @media (hover: hover) and (pointer: fine) {
        .space-card:hover {
            transform: scale(1.05);
        }

        .space-card:hover h2 {
            font-size: 80px;
        }
    }

    /* Блок изображения */
    .space-image {
        margin: 5px 5px 0 5px;
        border-radius: 3px;
        overflow: hidden;
        background-color: #f4f7fc;
        aspect-ratio: 320 / 620;
        width: 100%;
    }

    .space-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transition: all 0.2s;
        border-radius: 5px;
    }

    /* Заголовок */
    .space-card h2 {
        font-size: 60px;
        font-weight: 400;
        text-align: center;
        margin: 15px 0 10px 0;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        color: #171A2A;
        line-height: 1.1;
        transition: font-size 0.3s ease-out;
        width: 100%;
    }

    .space-card:hover {
        cursor: pointer;
    }

    /* ============================================ */
    /* АДАПТИВ ДЛЯ ПЛАНШЕТОВ (до 900px) */
    /* ============================================ */
    @media (max-width: 900px) {
        .spaces-container {
            padding: 15px;
        }

        .spaces-row {
            gap: 20px;
        }

        .space-card {
            width: 280px;
        }

        .space-image {
            aspect-ratio: 280 / 540;
        }

        .space-card h2 {
            font-size: 50px;
            margin: 12px 0 8px 0;
        }

        @media (hover: hover) and (pointer: fine) {
            .space-card:hover h2 {
                font-size: 65px;
            }
        }
    }

    /* ============================================ */
    /* АДАПТИВ ДЛЯ МОБИЛЬНЫХ (до 650px) */
    /* Карточки встают друг под друга */
    /* ============================================ */
    @media (max-width: 650px) {
        .spaces-container {
            padding: 10px;
        }

        .spaces-row {
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }

        .space-card {
            width: 100%;
            max-width: 400px;
        }

        .space-image {
            aspect-ratio: 1 / 1.2;
            margin: 0;
            border-radius: 8px;
        }

        .space-image img {
            border-radius: 8px;
        }

        .space-card h2 {
            font-size: 48px;
            margin: 12px 0 5px 0;
        }

        /* Убираем масштабирование на тач-устройствах */
        @media (hover: hover) and (pointer: fine) {
            .space-card:hover {
                transform: scale(1.02);
            }

            .space-card:hover h2 {
                font-size: 54px;
            }
        }
    }

    /* ============================================ */
    /* ОЧЕНЬ МАЛЕНЬКИЕ ТЕЛЕФОНЫ (до 480px) */
    /* ============================================ */
    @media (max-width: 480px) {
        .spaces-container {
            padding: 8px;
        }

        .spaces-row {
            gap: 25px;
        }

        .space-card {
            max-width: 100%;
        }

        .space-card h2 {
            font-size: 38px;
            margin: 10px 0 5px 0;
        }

        .space-image {
            aspect-ratio: 1 / 1.3;
        }

        @media (hover: hover) and (pointer: fine) {
            .space-card:hover h2 {
                font-size: 42px;
            }
        }
    }
</style>

<script>
// Скрипт для смены изображений при наведении
(function() {
    // Функция для проверки загрузки изображений и создания fallback при необходимости
    function handleImageFallback(imgElement, originalSrc, hoverSrc, cardTitle) {
        imgElement.onerror = function() {
            if (!imgElement.getAttribute('data-fallback-set')) {
                imgElement.setAttribute('data-fallback-set', 'true');
                // Создаем canvas-заглушку
                const canvas = document.createElement('canvas');
                canvas.width = 400;
                canvas.height = 500;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#3a6ea5';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffffff';
                ctx.font = 'bold 36px system-ui, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(cardTitle, canvas.width/2, canvas.height/2);

                const fallbackSrc = canvas.toDataURL('image/png');
                imgElement.src = fallbackSrc;

                const parentCard = imgElement.closest('.space-card');
                if (parentCard && !parentCard.getAttribute('data-hover-fallback-set')) {
                    parentCard.setAttribute('data-hover-fallback-set', 'true');
                    const hoverCanvas = document.createElement('canvas');
                    hoverCanvas.width = 400;
                    hoverCanvas.height = 500;
                    const hoverCtx = hoverCanvas.getContext('2d');
                    hoverCtx.fillStyle = '#c23b22';
                    hoverCtx.fillRect(0, 0, hoverCanvas.width, hoverCanvas.height);
                    hoverCtx.fillStyle = '#f9e0a0';
                    hoverCtx.font = 'bold 36px system-ui, sans-serif';
                    hoverCtx.textAlign = 'center';
                    hoverCtx.textBaseline = 'middle';
                    hoverCtx.fillText(cardTitle + ' ✨', hoverCanvas.width/2, hoverCanvas.height/2);
                    const hoverFallback = hoverCanvas.toDataURL('image/png');
                    parentCard.setAttribute('data-hover-img', hoverFallback);
                }
            }
        };

        imgElement.src = originalSrc;
    }

    document.addEventListener('DOMContentLoaded', function() {
        const cards = document.querySelectorAll('.space-card');

        cards.forEach(function(card) {
            const imgElement = card.querySelector('.space-image img');
            if (!imgElement) return;

            const title = card.querySelector('h2')?.innerText || 'Пространство';

            let originalSrc = card.getAttribute('data-original-img');
            let hoverSrc = card.getAttribute('data-hover-img');

            card.setAttribute('data-original-img', originalSrc);
            card.setAttribute('data-hover-img', hoverSrc);

            handleImageFallback(imgElement, originalSrc, hoverSrc, title);

            // Только для устройств с мышью (не тач)
            const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

            if (!isTouchDevice) {
                card.addEventListener('mouseenter', function() {
                    const hoverImg = this.getAttribute('data-hover-img');
                    if (hoverImg && hoverImg !== '' && imgElement.src !== hoverImg) {
                        imgElement.src = hoverImg;
                    }
                });

                card.addEventListener('mouseleave', function() {
                    const originalImg = this.getAttribute('data-original-img');
                    if (originalImg && originalImg !== '' && imgElement.src !== originalImg) {
                        imgElement.src = originalImg;
                    }
                });
            }
        });
    });
})();
</script>
{% endblock %}
